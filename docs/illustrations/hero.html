<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.card{height:300px;padding:0;display:flex;align-items:center}
.glow{position:absolute;left:-60px;top:-110px;width:520px;height:520px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,180,62,.95) 0%,rgba(255,150,50,.55) 9%,rgba(200,90,30,.18) 30%,rgba(17,19,23,0) 62%)}
.spark{position:absolute;left:182px;top:128px;width:16px;height:16px;border-radius:50%;background:#fff3d6;box-shadow:0 0 18px 6px rgba(255,200,120,.9)}
.text{position:relative;margin-left:340px;padding-right:24px}
.word{font-size:58px;font-weight:200;letter-spacing:.32em;color:#f5efe2}
.tag{font-size:17px;color:var(--ink-2);margin-top:8px;line-height:1.4}
.pills{display:flex;gap:8px;margin-top:20px;flex-wrap:nowrap}
.pill{white-space:nowrap;font-size:12px;font-weight:600;padding:7px 11px;border-radius:999px;background:#1c2028;border:1px solid #2c313b;color:var(--ink)}
.pill b{color:var(--ember);font-weight:700;margin-right:6px}
</style></head><body><div class="card"><div class="glow"></div><div class="spark"></div>
<div class="text"><div class="word">LUMEN</div>
<div class="tag">A faster, ad-free, safer home for<br>Android projectors &mdash; no flashing, fully reversible.</div>
<div class="pills"><span class="pill"><b>&#9650;</b>Faster</span><span class="pill"><b>&#10005;</b>No ads</span><span class="pill"><b>&#9673;</b>Heat guard</span><span class="pill"><b>&#10003;</b>Verified updates</span></div>
</div></div></body></html>
